<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
    <title>Wallpaper Todo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header (drag region) -->
      <header class="titlebar" id="titlebar">
        <div class="head-left">
          <div class="identity"><span class="status-dot"></span> wallpaper <span class="identity-slash">/</span> todo</div>
          <div class="greeting" id="greeting">Hello</div>
          <div class="datetime">
            <span class="clock" id="clock">--:--</span>
            <span class="date" id="date"></span>
          </div>
        </div>
        <div class="head-actions no-drag">
          <button class="icon-btn" id="btn-theme" title="Theme" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor" stroke="none"/></svg></button>
          <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button>
          <button class="icon-btn" id="btn-hide" title="Hide (tray to reopen)" aria-label="Hide (tray to reopen)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        </div>
      </header>

      <!-- Progress -->
      <div class="progress-heading"><span>TASK PROGRESS</span><span class="progress-label" id="progress-label">0 of 0 done</span></div>
      <div class="progress-row no-drag">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

      </div>

      <!-- List tabs -->
      <nav class="list-tabs no-drag" id="list-tabs" aria-label="Task lists"></nav>

      <!-- Todo list -->
      <main class="todos no-drag" id="todos">
        <div class="flow-notice" id="flow-notice" hidden>
          <span id="flow-message" role="status" aria-live="polite"></span>
          <button type="button" class="mini-btn" id="flow-action" hidden>Undo</button>
          <button type="button" class="icon-btn" id="flow-dismiss" aria-label="Dismiss notification">×</button>
        </div>
        <ul class="todo-list" id="todo-list"></ul>
        <div class="empty-state" id="empty-state" hidden>
          <div class="empty-emoji"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="24" cy="24" r="17"/><path d="m16 24 6 6 11-12"/></svg></div>
          <div class="empty-title">All clear</div>
          <div class="empty-sub">A little space for what comes next.</div>
        </div>
      </main>

      <!-- Quick add -->
      <form class="quick-add no-drag" id="quick-add" autocomplete="off">
        <label class="composer-label" for="qa-text">WHAT’S NEXT?</label>
        <input type="text" id="qa-text" aria-label="New task" placeholder="Make room for one thing…" maxlength="500" />
        <div class="qa-controls">
          <select id="qa-priority" title="Priority" aria-label="Priority">
            <option value="none">Priority</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
          <input type="date" id="qa-date" title="Due date" aria-label="Due date" />
          <select id="qa-list" title="List" aria-label="List"></select>
          <button type="submit" class="add-btn" id="qa-add">Add <span aria-hidden="true">↵</span></button>
        </div>
      </form>
      <footer class="widget-footer"><span><span class="status-dot"></span> LOCAL &amp; OFFLINE</span><span>Ctrl + Alt + T</span></footer>
    </div>

    <!-- Settings popover -->
    <div class="popover" id="settings-pop" hidden>
      <div class="pop-head">Settings</div>

      <label class="pop-row">
        <span>Theme</span>
        <select id="set-theme"></select>
      </label>

      <label class="pop-row">
        <span>Opacity</span>
        <input type="range" id="set-opacity" min="0.4" max="1" step="0.05" />
      </label>

      <label class="pop-row switch-row">
        <span>Hide completed</span>
        <input type="checkbox" id="set-hidecompleted" />
      </label>

      <label class="pop-row switch-row">
        <span>Start on login</span>
        <input type="checkbox" id="set-autostart" />
      </label>

      <div class="pop-sep"></div>
      <div class="pop-head sub">Lists</div>
      <div class="lists-editor" id="lists-editor"></div>
      <form class="add-list-row" id="add-list-form">
        <input type="text" aria-label="New list name" id="new-list-name" placeholder="New list…" maxlength="40" />
        <input type="color" aria-label="New list color" id="new-list-color" value="#6ea8fe" />
        <button type="submit" class="mini-btn">Add</button>
      </form>

      <div class="pop-sep"></div>
      <div class="pop-actions">
        <button class="mini-btn" id="btn-reset">Reset position</button>
        <button class="mini-btn danger" id="btn-quit">Quit</button>
      </div>
      <div class="pop-foot">Summon anytime with <b>Ctrl+Alt+T</b></div>
    </div>

    <!-- Theme quick menu -->
    <div class="popover theme-menu" id="theme-pop" hidden>
      <div class="pop-head">Theme</div>
      <div id="theme-choices" class="theme-choices"></div>
    </div>

    <script src="themes.js"></script>
    <script src="store.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
